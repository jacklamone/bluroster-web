name: Decode brand icons
on:
  workflow_dispatch:
  push:
    paths:
      - "apple-touch-icon.png.b64"
      - "icon-192.png.b64"
      - "icon-512.png.b64"
      - "favicon-32.png.b64"
      - ".github/workflows/decode-icons.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v5 iOS icon from known-good 192
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("icon-192-v3.png")
          if not src.exists():
              src = Path("icon-192.png")
          data = src.read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n"
          assert len(data) > 20000
          print("source", src, len(data))
          for name in ["apple-touch-icon.png", "apple-touch-icon-180-v5.png"]:
              Path(name).write_bytes(data)
              print("wrote", name)
          p = Path("index.html")
          t = p.read_text()
          t2, n = re.subn(
              r'<link rel="apple-touch-icon"[^>]*>',
              '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180-v5.png"/>',
              t,
              count=1,
          )
          print("patched", n)
          if n:
              p.write_text(t2)
          PY
          ls -la apple-touch-icon*.png icon-192*.png
      - name: Commit PNGs and HTML patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png apple-touch-icon-180-v5.png index.html
          if git diff --cached --quiet; then
            echo "no icon changes"
          else
            git commit -m "fix: apple-touch-icon v5 valid metallic PNG"
            git push
          fi
