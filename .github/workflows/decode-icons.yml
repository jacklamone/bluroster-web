name: Decode brand icons
on:
  workflow_dispatch:
  push:
    paths:
      - "icon-parts/**"
      - ".github/workflows/decode-icons.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble brushed-metal apple-touch-icon v6
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          parts = sorted(Path("icon-parts").glob("apple-touch-icon.png.b64.p*"))
          if not parts:
              raise SystemExit("no icon-parts found")
          raw_txt = "".join(p.read_text() for p in parts)
          b64 = re.sub(r"[^A-Za-z0-9+/=]", "", raw_txt)
          raw = base64.b64decode(b64)
          print("parts", [p.name for p in parts], "b64", len(b64), "bytes", len(raw))
          assert raw[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          assert raw[-8:] == b"IEND\xaeB`\x82", "missing IEND"
          got = hashlib.sha256(raw).hexdigest()
          exp = Path("icon-parts/EXPECTED_SHA256.txt")
          if exp.exists():
              want = exp.read_text().strip()
              if got != want:
                  print("WARN sha mismatch", got, "!=", want, "(publishing valid PNG anyway)")
          Path("apple-touch-icon.png").write_bytes(raw)
          Path("apple-touch-icon-precomposed.png").write_bytes(raw)
          Path("apple-touch-icon-180-v6.png").write_bytes(raw)
          Path("brand/v6").mkdir(parents=True, exist_ok=True)
          Path("brand/v6/apple-touch-icon.png").write_bytes(raw)
          print("wrote", len(raw), got)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          href = "./apple-touch-icon-180-v6.png"
          p = Path("index.html")
          t = p.read_text()
          t2, n = re.subn(
              r'<link rel="apple-touch-icon"[^>]*>',
              f'<link rel="apple-touch-icon" sizes="180x180" href="{href}"/>',
              t,
              count=1,
          )
          if "apple-touch-icon-precomposed" not in t2:
              t2 = t2.replace(
                  f'<link rel="apple-touch-icon" sizes="180x180" href="{href}"/>',
                  f'<link rel="apple-touch-icon" sizes="180x180" href="{href}"/><link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-precomposed.png"/>',
                  1,
              )
          p.write_text(t2)
          print("patched index.html", n)
          mf = Path("manifest.json")
          if mf.exists():
              data = json.loads(mf.read_text())
              data["icons"] = [
                  {"src": "apple-touch-icon-180-v6.png", "sizes": "180x180", "type": "image/png", "purpose": "any"},
                  {"src": "icon-192-v3.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
                  {"src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"},
              ]
              mf.write_text(json.dumps(data, indent=2) + "\n")
              print("patched manifest.json")
          PY
      - name: Commit PNGs and HTML patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png apple-touch-icon-precomposed.png apple-touch-icon-180-v6.png brand/v6/apple-touch-icon.png index.html manifest.json
          if git diff --cached --quiet; then
            echo "no icon changes"
          else
            git commit -m "chore: apply brushed-metal apple-touch-icon v6"
            git push
          fi
